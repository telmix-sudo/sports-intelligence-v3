services:
  freqtrade:
    build: .
    container_name: freqtrade-paper-250-eur
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PAPER_DATA_DIR: /freqtrade/runtime
      PAPER_BIND: 0.0.0.0
      PORT: "8080"
    volumes:
      - paper-state:/freqtrade/runtime
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  paper-state:
