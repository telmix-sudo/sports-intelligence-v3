name: V3 - Optuna and LightGBM Research

on:
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ml-lab.yml'
      - 'requirements-ml.txt'
      - 'src/sports_intelligence/ml_lab.py'
      - 'tests/test_ml_lab.py'
      - 'scripts/ai_review_digest.py'

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: v3-daily-ml-research
  cancel-in-progress: false

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install isolated optional ML dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Test core and optional ML including chronological leakage checks
        run: python -m unittest discover -s tests -v
      - name: Refresh latest published calendar
        run: git pull --ff-only origin main
      - name: Train, tune, calibrate and evaluate zero-stake model
        run: python -m sports_intelligence.ml_lab --trials 12 --timeout 180
      - name: Record observed external review activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ai_review_digest.py
      - name: Persist only ML observations and reports
        run: |
          git config user.name 'sports-intelligence-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ml_lab_latest.json reports/ai_review_latest.json
          if [ -f data/ml_observations_v3.jsonl ]; then git add data/ml_observations_v3.jsonl; fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: zero-stake ML research and review inventory [skip ci]'
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort; exit 1; }
              sleep 3
            done
            exit 1
          fi
      - name: Save research diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-ml-research
          path: |
            reports/ml_lab_latest.json
            reports/ai_review_latest.json
            data/ml_observations_v3.jsonl
          if-no-files-found: ignore
          retention-days: 14
