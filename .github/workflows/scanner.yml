name: Sports Intelligence V3 — Hourly Paper Scanner

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scanner.yml"
      - "src/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: sports-intelligence-v3-hourly
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before scanning
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Scan upcoming events and run historical benchmarks
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          ENABLE_ATP_RESEARCH: "0"
        run: python -m sports_intelligence.cli --mode scan
      - name: Persist honest scan report and zero-stake observations
        run: |
          git config user.name "sports-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/latest.json data/forecasts_v3.jsonl 2>/dev/null || git add reports/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "data: record prospective research scan [skip ci]"
            git push origin HEAD:main
          fi
      - name: Publish diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-report
          path: reports/latest.json
          if-no-files-found: ignore
          retention-days: 14
