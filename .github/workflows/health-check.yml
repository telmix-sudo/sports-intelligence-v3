name: Sports Intelligence V3 - Paper Health Audit

on:
  workflow_run:
    workflows: ["Sports Intelligence V3 — Hourly Paper Scanner"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/check_v3_health.py"
      - ".github/workflows/health-check.yml"

permissions:
  contents: read

concurrency:
  group: v3-health-audit
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh published data before audit
        run: git pull --ff-only origin main
      - name: Audit last report, balances and overdue official results
        run: python scripts/check_v3_health.py
