# Automated multi-market collection, backfill, admission and append-only settlement.
# 2026-10-31 22:42 UTC paper safety, reporting and all 12 wallet regression smoke test.
# 2026-10-31 22:30 UTC: refresh V3 paper ledger for day-end settlement (Aston Villa–Fulham).
# Manual audit and fresh settlement of completed 31 Oct fixtures at 19h Portugal; paper-only.
# Paper daily target 1–3 distinct events; persistence/odds catch-up smoke test 2026-10-28.
# 2026-10-28 restart after fixing frequency-strategy registry tests.
# Eight quantitative paper models plus ninth independent daily market reference; recovery run 2026-10-27.
name: Sports Intelligence V3 - Parallel Strategy Lab

on:
  workflow_run:
    workflows: ["Sports Intelligence V3 — Hourly Paper Scanner"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/strategy-lab.yml"
      - "src/**"
      - "tests/**"

permissions:
  contents: write

concurrency:
  group: sports-intelligence-v3-data
  cancel-in-progress: false
  queue: max

jobs:
  research:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test all strategies and anti-leakage protections
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      # The scanner publishes odds in another workflow. The lab must refresh
      # checkout AFTER tests and immediately BEFORE choosing its paper events.
      - name: Refresh latest scanner odds from main
        run: git pull --ff-only origin main
      - name: Check scanner and calendar freshness
        id: freshness
        env:
          PYTHONPATH: src
        run: python -m sports_intelligence.runtime_freshness --github-output "$GITHUB_OUTPUT"
      - name: Recover delayed scanner before portfolio analysis
        id: refresh_scanner
        if: steps.freshness.outputs.needs_scanner == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          ENABLE_ATP_RESEARCH: "0"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m sports_intelligence.cli --mode scan
      - name: Run independent strategy portfolios with CC0 data
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
          V3_SCANNER_RECOVERY_OUTCOME: ${{ steps.refresh_scanner.outcome }}
        run: python -m sports_intelligence.strategy_lab
      - name: Persist comparisons and virtual account ledgers
        run: |
          git config user.name "sports-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          if ! git diff --cached --quiet; then
            git commit -m "data: parallel paper strategy observations [skip ci]"
            # Only independent ML files may update while this shared writer runs.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update: rebasing only lab's independent files"
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "Could not persist lab snapshot after retries"
            exit 1
          fi
      - name: Publish diagnostic artifact even if persistence fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-report
          path: |
            reports/strategy_lab_latest.json
            data/strategy_accounts_v3.json
            reports/market_research_latest.json
            data/selection_official_audit_v3.json
            data/selection_experiment_v3.jsonl
            data/decision_observations_v3.jsonl
            data/score_history_v3.json
            data/market_research_v3.jsonl
          if-no-files-found: ignore
          retention-days: 14
