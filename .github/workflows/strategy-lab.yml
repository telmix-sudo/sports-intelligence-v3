# Paper daily target 1–3 distinct events; persistence/odds catch-up smoke test 2026-10-28.
# 2026-10-28 restart after fixing frequency-strategy registry tests.
# Eight quantitative paper models plus ninth independent daily market reference; recovery run 2026-10-27.
name: Sports Intelligence V3 - Parallel Strategy Lab

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/strategy-lab.yml"

permissions:
  contents: write

concurrency:
  group: sports-intelligence-parallel-lab
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test all strategies and anti-leakage protections
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run eight isolated strategy portfolios with CC0 data
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"
        run: python -m sports_intelligence.strategy_lab
      - name: Persist comparisons and virtual account ledgers
        run: |
          git config user.name "sports-intelligence-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/strategy_ledgers data/strategy_accounts_v3.json data/strategy_registry_v3.json reports/strategy_lab_latest.json reports/strategy_lab_runs/
          if ! git diff --cached --quiet; then
            git commit -m "data: parallel paper strategy observations [skip ci]"
            # The hourly scanner may have pushed a report concurrently.
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Concurrent update: rebasing only lab's independent files"
              git fetch origin main
              git rebase origin/main
              sleep 3
            done
            echo "Could not persist lab snapshot after retries"
            exit 1
          fi
      - name: Publish diagnostic artifact even if persistence fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strategy-lab-report
          path: |
            reports/strategy_lab_latest.json
            data/strategy_accounts_v3.json
          if-no-files-found: ignore
          retention-days: 14
