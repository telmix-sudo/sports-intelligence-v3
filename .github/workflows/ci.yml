name: Validate Sports Intelligence V3

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/*.html"
      - "docs/*.js"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  ml-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: src
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - name: Install optional ML test dependencies
        run: python -m pip install -r requirements-ml.txt
      - name: Verify actual Optuna and LightGBM training and core regressions
        run: python -m unittest discover -s tests -v
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and anti-leakage tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m sports_intelligence.cli --help
      - name: Validate inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page in (Path("docs/index.html"), Path("docs/strategies.html")):
              html = page.read_text(encoding="utf8")
              scripts = [body for attrs, body in re.findall(r"<script([^>]*)>(.*?)</script>", html, flags=re.S|re.I)
                         if not re.search(r"\bsrc\s*=", attrs, flags=re.I) and body.strip()]
              if not scripts:
                  raise RuntimeError(f"Dashboard JS missing: {page}")
              Path(f"/tmp/v3-{page.stem}.js").write_text("\n".join(scripts), encoding="utf8")
              print(f"Extracted dashboard script from {page}")
          PY
          node --check /tmp/v3-index.js
          node --check /tmp/v3-strategies.js

      - name: Verify wallet balance calculations and Lisbon period boundaries
        run: |
          node --check docs/balance.js
          node --test tests/test_balance.cjs
