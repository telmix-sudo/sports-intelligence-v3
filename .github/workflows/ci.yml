name: Validate Sports Intelligence V3

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "docs/*.html"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and anti-leakage tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m sports_intelligence.cli --help
      - name: Validate inline dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for page in (Path("docs/index.html"), Path("docs/strategies.html")):
              html = page.read_text(encoding="utf8")
              script = re.search(r"<script[^>]*>(.*?)</script>", html, flags=re.S|re.I)
              if script is None:
                  raise RuntimeError(f"Dashboard JS missing: {page}")
              Path(f"/tmp/v3-{page.stem}.js").write_text(script.group(1), encoding="utf8")
              print(f"Extracted dashboard script from {page}")
          PY
          node --check /tmp/v3-index.js
          node --check /tmp/v3-strategies.js
