name: Validate Sports Intelligence V3

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and anti-leakage tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        env:
          PYTHONPATH: src
        run: python -m sports_intelligence.cli --help
